<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>S6 baseline picker</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e2e0da;
  --accent: #2f5d8a; --accent-soft: #e5edf5; --warn: #8a4b12; --warn-soft: #fbefe2;
  --bad: #9b2226; --bad-soft: #f9e3e3; --ok: #2d6a4f; --chip: #efede8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151514; --panel: #1f1f1d; --ink: #ecebe7; --muted: #a09e98; --line: #34332f;
    --accent: #8db8e3; --accent-soft: #23303d; --warn: #f0b77a; --warn-soft: #3a2a19;
    --bad: #f2a3a5; --bad-soft: #3d1f20; --ok: #8fd1ae; --chip: #2a2a27;
  }
}
:root[data-theme="dark"] {
  --bg: #151514; --panel: #1f1f1d; --ink: #ecebe7; --muted: #a09e98; --line: #34332f;
  --accent: #8db8e3; --accent-soft: #23303d; --warn: #f0b77a; --warn-soft: #3a2a19;
  --bad: #f2a3a5; --bad-soft: #3d1f20; --ok: #8fd1ae; --chip: #2a2a27;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; }
.banner { display: inline-block; font-weight: 700; letter-spacing: .02em; background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); border-radius: 6px; padding: 3px 9px; }
.banner.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
h1 { font-size: 18px; margin: 0 0 6px; }
.sub { color: var(--muted); font-size: 12.5px; margin-top: 6px; max-width: 980px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
input[type=search], select { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
input[type=search] { min-width: 240px; flex: 1 1 240px; max-width: 420px; }
main { padding: 12px 16px 120px; max-width: 1400px; margin: 0 auto; }
.scene { margin: 22px 0 8px; }
.scene h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; font-weight: 650; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; min-width: 0; }
.card.picked { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.card h3 { font-size: 15px; margin: 0; overflow-wrap: anywhere; }
.claude { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.chip { background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 11.5px; color: var(--muted); }
.chip.sens { background: var(--warn-soft); color: var(--warn); }
.hidden-note { margin-top: 8px; font-size: 12.5px; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 6px 8px; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--accent); font-size: 12.5px; }
ol.members { margin: 6px 0 0; padding-left: 22px; }
ol.members li { margin: 3px 0; overflow-wrap: anywhere; }
.h { color: var(--muted); font-size: 12px; }
.bio { color: var(--muted); font-size: 12px; display: block; }
.extras { margin-top: 6px; font-size: 12.5px; }
.extras div { margin-top: 3px; overflow-wrap: anywhere; }
button { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
.top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
#tray { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 16px; max-height: 45vh; overflow: auto; z-index: 6; }
#tray.empty { display: none; }
#tray ol { columns: 2 280px; margin: 6px 0 0; }
.empty-state { padding: 30px 0; color: var(--muted); }
a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Cold-start picker <span class="banner" id="banner">baseline, not evaluated</span></h1>
  <div class="sub" id="sub"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="Search labels, list names, handles" aria-label="Search cards">
    <select id="lang" aria-label="Language"></select>
    <select id="show" aria-label="Which cards">
      <option value="all">All cards</option>
      <option value="members">Cards with member lists</option>
      <option value="sensitive">Sensitive (member list hidden)</option>
    </select>
    <span class="h" id="count"></span>
  </div>
</header>
<main id="main"></main>
<div id="tray" class="empty"></div>
<script>
const DATA = /*__DATA__*/null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n) => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);
const picked = [];
const BUNDLE = 25, POP_LIMIT = 500000, POP_MAX = 2;

function header() {
  const c = DATA.counts;
  if (DATA.dry_run) { $("#banner").textContent = "baseline, not evaluated · DRY RUN (S5 live checks absent or unverified)"; $("#banner").classList.add("bad"); }
  const ex = Object.entries(c.excluded).map(([k, v]) => `${k.replaceAll("_", " ")} ${v}`).join(", ");
  $("#sub").innerHTML = `Internal review for Josh only (127.0.0.1, never published). cand1 communities as cards, grouped by scene; ` +
    `labels are the community's most common A-half curated-list names, with Claude's label as a second line. ` +
    `Each bundle is 25 accounts from provisional eligibility (unflagged, on an A-half list, passed S5's live check). ` +
    `Cards whose list names match the S1 sensitive-class keywords, or that Claude marks sensitive, show no members. ` +
    `<b>${c.cards}</b> cards (${c.with_members} with members, ${c.member_list_hidden_sensitive} with the member list hidden). Not shown: ${esc(ex)}. Built ${esc(DATA.generated_at)}.`;
  const langs = {};
  for (const cd of Object.values(DATA.cards)) langs[cd.language] = (langs[cd.language] || 0) + 1;
  $("#lang").innerHTML = `<option value="">All languages</option>` + Object.entries(langs).sort((a, b) => b[1] - a[1])
    .map(([l, n]) => `<option value="${esc(l)}">${esc(l)} (${n})</option>`).join("");
}

function member(m) {
  const hfr = m.hfr ? ` <span class="chip" title="Has hideFromAlgorithmicRecommendations: their posts are never shown (A1); the account may be suggested">posts hidden</span>` : "";
  const who = m.name ? `<b>${esc(m.name)}</b> <span class="h">@${esc(m.handle)} · ` : `<b>@${esc(m.handle)}</b> <span class="h">`;
  return `<li>${who}${fmt(m.followers)} followers</span>${hfr}` +
    (m.bio ? `<span class="bio">${esc(m.bio)}</span>` : "") + `</li>`;
}

function cardHTML(cd) {
  const chips = [`<span class="chip">${esc(cd.language)}</span>`, `<span class="chip">${fmt(cd.size)} members</span>`,
    `<span class="chip">${cd.eligible} eligible</span>`, `<span class="chip">c${cd.community}</span>`];
  if (cd.claude && cd.claude.community_type) chips.push(`<span class="chip">${esc(cd.claude.community_type.replaceAll("_", " "))}</span>`);
  let body = "";
  if (cd.sensitive) {
    const why = [...cd.keyword_classes.map((k) => "list names: " + k), ...cd.claude_sensitivity.map((k) => "Claude: " + k)];
    chips.push(`<span class="chip sens">sensitive</span>`);
    body = `<div class="hidden-note">Member list hidden: ${esc(why.join(", ").replaceAll("_", " "))}.</div>`;
  } else {
    body = `<details data-c="${cd.community}"><summary>Bundle: ${BUNDLE} accounts</summary><ol class="members"></ol></details>`;
    const ex = [];
    for (const p of cd.packs) ex.push(`<div>Pack: ${esc(p.name || "starter pack")} ${p.creator_handle ? "by @" + esc(p.creator_handle) : ""} <span class="h">(${p.members} members, ${p.in_card} from this card)</span></div>`);
    for (const f of cd.feeds) ex.push(`<div>Feed: ${esc(f.name)} <span class="h">by @${esc(f.creator_handle)}</span></div>`);
    if (ex.length) body += `<div class="extras">${ex.join("")}</div>`;
  }
  const claude = cd.claude && cd.claude.label ? `<div class="claude">Claude: ${esc(cd.claude.label)}${cd.claude.description ? " — " + esc(cd.claude.description) : ""}</div>` : "";
  const pick = cd.sensitive ? "" : `<button data-pick="${cd.community}" class="${picked.includes(cd.community) ? "on" : ""}">${picked.includes(cd.community) ? "Picked" : "Pick"}</button>`;
  return `<article class="card${picked.includes(cd.community) ? " picked" : ""}" data-card="${cd.community}">` +
    `<div class="top"><h3>${esc(cd.label)}</h3>${pick}</div>${claude}<div class="meta">${chips.join("")}</div>${body}</article>`;
}

function matches(cd, q, lang, show) {
  if (lang && cd.language !== lang) return false;
  if (show === "members" && cd.sensitive) return false;
  if (show === "sensitive" && !cd.sensitive) return false;
  if (!q) return true;
  const hay = [cd.label, cd.claude && cd.claude.label, cd.claude && cd.claude.description, ...cd.list_names.map((x) => x[0]),
    ...cd.members.map((m) => m.handle + " " + m.name)].join(" ").toLowerCase();
  return q.split(/\s+/).every((t) => hay.includes(t));
}

function draw() {
  const q = $("#q").value.trim().toLowerCase(), lang = $("#lang").value, show = $("#show").value;
  let n = 0, html = "";
  for (const s of DATA.scenes) {
    const cs = s.cards.map((c) => DATA.cards[c]).filter((cd) => matches(cd, q, lang, show));
    if (!cs.length) continue;
    n += cs.length;
    html += `<section class="scene"><h2>Scene ${s.scene}: ${esc(s.name)} <span class="h">(${cs.length})</span></h2><div class="grid">${cs.map(cardHTML).join("")}</div></section>`;
  }
  $("#main").innerHTML = html || `<div class="empty-state">No cards to show. ${DATA.live_present ? "" : "S5 (i) live checks are not available yet, so every card is excluded (a card whose members lack a live check is never shown)."}</div>`;
  $("#count").textContent = `${n} shown`;
}

function solve() {
  // Bundle solver (S1 §10, Y6): <=5 cards; 25 accounts; 1-2 cards split evenly; >=3 cards: >=3 each, <=40% from one card;
  // <=2 accounts over 500k followers. Shortfalls are filled from the other picked cards (the registered KnownFor-neighbour
  // fill rule is not built for this baseline).
  const cs = picked.map((c) => DATA.cards[c]);
  const k = cs.length, cap = k >= 3 ? Math.floor(BUNDLE * 0.4) : BUNDLE;
  const quota = cs.map((_, i) => Math.min(cap, Math.floor(BUNDLE / k) + (i < BUNDLE % k ? 1 : 0)));
  const out = [], seen = new Set(); let big = 0;
  const take = (cd, want) => {
    let got = 0;
    for (const m of cd.members) {
      if (got >= want) break;
      if (seen.has(m.did)) continue;
      if (m.followers > POP_LIMIT && big >= POP_MAX) continue;
      if (m.followers > POP_LIMIT) big++;
      seen.add(m.did); out.push([cd, m]); got++;
    }
    return got;
  };
  let short = 0;
  cs.forEach((cd, i) => { short += quota[i] - take(cd, quota[i]); });
  for (const cd of cs) { if (short <= 0) break; const per = out.filter((x) => x[0] === cd).length; short -= take(cd, Math.min(short, cap - per)); }
  return out;
}

function tray() {
  const t = $("#tray");
  if (!picked.length) { t.className = "empty"; t.innerHTML = ""; return; }
  const b = solve();
  t.className = "";
  t.innerHTML = `<div class="top"><b>Picked ${picked.length}/5 · combined bundle ${b.length} accounts</b><button id="clear">Clear</button></div>` +
    `<ol>${b.map(([cd, m]) => `<li>${m.name ? esc(m.name) + " " : ""}<span class="h">@${esc(m.handle)} · ${fmt(m.followers)} · from “${esc(cd.label)}” (c${cd.community})</span></li>`).join("")}</ol>`;
  $("#clear").onclick = () => { picked.length = 0; tray(); draw(); };
}

document.addEventListener("toggle", (e) => {
  const d = e.target;
  if (d.tagName !== "DETAILS" || !d.open || !d.dataset.c) return;
  const ol = d.querySelector("ol");
  if (!ol.children.length) ol.innerHTML = DATA.cards[d.dataset.c].members.slice(0, BUNDLE).map(member).join("");
}, true);
document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-pick]");
  if (!b) return;
  const c = Number(b.dataset.pick), i = picked.indexOf(c);
  if (i >= 0) picked.splice(i, 1); else if (picked.length < 5) picked.push(c);
  draw(); tray();
});
for (const id of ["#q", "#lang", "#show"]) $(id).addEventListener("input", draw);
header(); draw();
</script>
</body>
</html>
